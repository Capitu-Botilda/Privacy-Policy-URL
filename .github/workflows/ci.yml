name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sha256:
    name: Verifica sha256 do index.html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confere sha256 contra index.html.sha256
        run: sha256sum --check index.html.sha256
